                </form>
                <button command="show-modal" commandfor="config-login-modal" class="button button-accent"

    <script>

        /**
         * Custom event for the barcode scan process
         */
        class BarcodeScanEvent extends Event {
            /**
             * @typedef {"ERROR"|"OK"} BarcodeScanStatus
             * @typedef {{firstName:string, lastName:string}} BarcodeScanData
             * @typedef {{status:BarcodeScanStatus, data:BarcodeScanData}} BarcodeScanResult
             * @type {BarcodeScanResult}
             */
            #result = { status: "ERROR", data: { firstName: undefined, lastName: undefined } };

            /**
             * @param {BarcodeScanStatus} status
             * @param {BarcodeScanData} data
             */
            constructor(status, data) {
                super("barcode-scan");
                this.#result = { status, data };
            }

            get status() {
                return this.#result.status;
            }

            get data() {
                return this.#result.data;
            }
        }

        /**
         * Custom event for pre-filling the entry form with data from the barcode scanner
         */
        class AutofillFormEvent extends Event {
            /**
             * @param {Record<string,string>} data
             */
            constructor(data) {
                super("autofill");
                this.data = data;
            }
        }

        /**
         * Custom event for optimistically updating the current label count.
         */
        class LabelCountEvent extends Event {
            /**
             * @param {number} count;
             */
            constructor(count) {
                super("label-count");
                this.count = count;
            }
        }

        class VisitorRecord {
            /**
             * Date and time of visitor's entry.
             * @type {Date}
             */
            entryDateTime

            /**
             * First name of the visitor
             * @type {string}
             */
            firstName

            /**
             * Last name of the visitor
             * @type {string}
             */
            lastName

            /**
             * Reason for visit
             * @type {string}
             */
            reason

            /**
             * Method used to complete the entry
             * @type {"form"|"barcode"}
             */
            method

            /**
             * Whether or not the label printed successfully (0 for no, 1 for yes).
             * @type {number}
             */
            labelPrinted

            constructor() {
                this.entryDateTime = new Date();
            }
        }

        class Config {
            /**
             * The password to modify configuration from the config panel
             * @type {string}
             */
            password

            /**
             * Default number of labels
             * @type {number}
             */
            labelDefaultCount

            /**
             * Current count of labels
             * @type {number}
             */
            labelCurrentCount

            /**
             * Sound effect for successful entry. Must be path relative to `/sfx`
             * @type {string}
             */
            audioEntryComplete

            /**
             * Sound effect for low labels. Must be path relative to `/sfx`
             * @type {string}
             */
            audioLowLabels
        }

        window.addEventListener("DOMContentLoaded", async () => {

            // Show warning when attempting to navigate away from page
            window.addEventListener('beforeunload', () => true);

            // Main content area
            /**
             * @type {HTMLElement}
             */
            const main = document.getElementById("main");

            // Entry form elements
            /**
             * @type {HTMLFormElement}
             */
            const entryForm = document.getElementById("entry-form");

            /**
             * The first name field
             * @type {HTMLInputElement}
             */
            const firstNameInput = document.getElementById("firstName");

            // Focus first name field on first page load
            firstNameInput.focus();

            /**
             * The last name field
             * @type {HTMLInputElement}
             */
            const lastNameInput = document.getElementById("lastName");

            /**
             * @type {HTMLFormElement}
             */
            const reasonForm = document.getElementById("reason-form");

            /**
             * @type {HTMLDialogElement}
             */
            const reasonDialog = document.getElementById("reason-modal");

            // Barcode Elements
            /**
            * @type {HTMLButtonElement}
            */
            const barcodeLaunchButton = document.getElementById("barcode-scan-launch");

            /**
             * @type {HTMLInputElement}
             */
            const labelCurrentCountIndicator = document.getElementById("label-current-count");

            /**
             * Internationalization form
             * @type {HTMLFormElement}
             */
            const internationalizationForm = document.getElementById("i18n");

            /**
             * Admin configuration login form
             * @type {HTMLFormElement}
             */
            const configLoginForm = document.getElementById("config-login-form");

            /**
             * Focus the first unfilled form field or submit button when clicking outside the form
             */
            main.addEventListener("click", e => {
                if (e.target === main) {
                    const { firstName, lastName } = entryForm;
                    try { [firstName, lastName, entryContinueButton].filter(({ value }) => !value).at(0).focus() } catch { };
                }
            })

            // Toasts
            const toasts = new Toast(document.getElementById("toast-container"), { timeout: 5000 });


            /**
             * @typedef {Record<string, string>} Config
             * @returns {Config}
             */
            async function initConfig() {
                return fetch('/api/config')
                    .then(data => data.json())
                    .then(({ status, data, error }) => {
                        if (error) throw error;
                        return Object.fromEntries(data.map(({ key, value }) => [key, value]))
                    })
                    .catch(err => {
                        // const popup = window.createPopupMessage();
                        // popup.showMessage("ERROR", `Somethign went wrong: ${err.message}`);
                        // popup.showModal();
                        toasts.newToast("ERROR", `Something went wrong: ${err.message}`);
                    });
            }

            /**
             * @type {Config}
             */
            const config = await initConfig()
                .then(config => {
                    labelCurrentCountIndicator.value = parseInt(config["labelCurrentCount"]);
                    return config;
                })

            labelCurrentCountIndicator.addEventListener("label-count", async ({ count }) => {
                labelCurrentCountIndicator.value = Math.floor(count);
                if (count <= config["labelLowThreshold"]) {
                    const sfx = await new Audio(config["audioLowTone"]);
                    await sfx.play();
                }
            })

            /**
             * @returns {"EN"|"ES"} Code representing current language
             */
            function currentLang() {
                return internationalizationForm.lang.value;
            }

            /**
             * 
             * INTERNATIONALIZATION FORM
             * 
             */
            internationalizationForm.addEventListener("change", () => {
                const { value: langCode } = internationalizationForm.lang;
                console.log(`Switching to language: ${langCode}`);
                i18n.translate(langCode, document.body);
            });


            /**
            * 
            * BARCODE SCANNING
            * 
            */

            debounce = (fn, t) => {
                let timeout;
                return function (...args) {
                    clearTimeout(timeout);
                    timeout = setTimeout(() => fn.apply(this, args), t);
                }
            }


            /**
             * Handle sequences of keypresses with callbacks for the start and end of reading.
             */
            class KeypressHandler {
                /**
                 * Blacklisted keypress events to prevent side effects
                 * @type {KeyboardEvent[]}
                 */
                static BLACKLIST = [
                    e => e.ctrlKey && e.key === 'j',                    // Open downloads
                    e => e.ctrlKey && e.key === 'q',                    // Quit browser
                    e => e.ctrlKey && e.key === 'd',                    // New bookmark
                    e => (e.ctrlKey || e.shiftKey) && e.key === 'w',    // Close tab/window
                    e => (e.ctrlKey || e.shiftKey) && e.key === 't',    // New tab / open last closed tab
                    e => e.key === 'Enter',                             // Submit form
                ]

                static isBlacklisted = (e) => KeypressHandler.BLACKLIST.some(fn => fn(e));

                /**
                 * Guess if a series of keypresses is human or automated input based on average of elapsed time between keypresses
                 * @param {KeyboardEvent[]} keypresses
                 * @return {"HUMAN"|"SCANNER"|"UNKNOWN"}
                 */
                static guess(keypresses) {
                    const INPUT_THRESHOLD_COUNT = 4;    // Minimum amount of input keypresses needed to attempt a guess
                    const HUMAN_THRESHOLD_MS = 10;      // Threshold of average time between keypresses before input considered human

                    if (!keypresses || keypresses.length < INPUT_THRESHOLD_COUNT) return "UNKNOWN"

                    const elapsed = [];
                    for (let i = 1; i < keypresses.length; i += 2) {
                        const [prev, curr] = [keypresses[i - 1], keypresses[i]];
                        elapsed.push(curr.timeStamp - prev.timeStamp);
                    }

                    const average = (...n) => n.reduce((p, c) => p + c) / n.length;
                    const avg = average(...elapsed);
                    console.debug(`Average time between keypresses: ${avg}`);
                    return avg < HUMAN_THRESHOLD_MS ? "SCANNER" : "HUMAN";
                }

                /**
                 * @type {KeyboardEvent[]}
                 */
                #buffer = [];

                /**
                 * @type {"IDLE"|"READ"|"PARSE"}
                 */
                #state = "IDLE";


                constructor(element, readingStartCb, readingStopCb) {
                    this.target = element;
                    this.target.addEventListener('keydown', e => this.handleKeydown(e));

                    this.readingStartCb = readingStartCb;
                    this.readingStopCb = readingStopCb;
                }


                #readingStartWrapper = (fn) => {
                    this.#state = "READ";
                    fn();
                }

                #readingStopWrapper = debounce(() => {
                    this.readingStopCb(this.#buffer);
                    this.flush();
                    this.#state = "IDLE";
                }, 250)

                /**
                 * @param {KeyboardEvent} e
                 */
                handleKeydown(e) {
                    if (KeypressHandler.isBlacklisted(e)) {
                        // console.debug('Blacklisted keypress', e);
                        e.preventDefault();
                    };
                    this.#state === "IDLE" && this.#readingStartWrapper(() => this.readingStartCb(this.#buffer));
                    this.#buffer.push(e);
                    this.#readingStopWrapper();
                }

                flush() {
                    this.#buffer = [];
                    this.#state = "IDLE";
                }
            }

            /**
             * @type {HTMLDialogElement}
             */
            let barcodePopup;
            const createBarcodePopup = debounce((keypresses) => {
                barcodePopup = window.createPopupMessage();
                if (KeypressHandler.guess(keypresses) === "SCANNER") {
                    barcodePopup.showSpinner();
                    barcodePopup.showModal();
                }

            }, 250);
            function readingStartCallback(keypresses) {
                createBarcodePopup();
            }



            /**
             * @param {KeyboardEvent[]} keypresses
             */
            function readingStopCallback(keypresses) {
                if (KeypressHandler.guess(keypresses) === "SCANNER") {
                    try {

                        /**
                         * @see {@link barcode.js}
                         */
                        const parser = new Pdf417Parser();
                        parser.feed(...keypresses);
                        const result = Object.fromEntries(parser.result);
                        // console.debug(parser);
                        // console.debug(result);

                        const [firstName, lastName] = [result["DAC"], result["DCS"]];
                        if (!firstName || !lastName) throw new Error();
                        const autoFillEvent = new AutofillFormEvent({ firstName, lastName });
                        entryForm.dispatchEvent(autoFillEvent);
                    } catch (err) {
                        toasts.newToast("ERROR", "Failed to read barcode input. Try again");
                    }
                }
            }

            const keypressHandle = new KeypressHandler(window, readingStartCallback, readingStopCallback);


            entryForm.addEventListener("autofill", ({ data }) => {
                for (const [key, value] of Object.entries(data)) {
                    entryForm[key].value = value;
                }
                toasts.newToast("MESSAGE", "Proceed from the form on the screen.");
            })


            const entryContinueButton = entryForm.querySelector("button")
            entryContinueButton.addEventListener("click", () => { if (entryForm.reportValidity()) reasonDialog.showModal() })



            reasonForm.querySelectorAll('label.reason-opt').forEach(
                /**
                 * @param {HTMLLabelElement} el
                 */
                (el, i, nodes) => {

                    el.addEventListener("click", e => {
                        el.control.toggleAttribute("checked", true);
                        reasonForm.requestSubmit();
                    });

                    el.addEventListener("keydown",
                        /**
                         * @param {KeyboardEvent} e
                         */
                        e => {
                            const { key } = e;
                            console.log(key)
                            switch (key) {
                                case "Tab":

                                    // Enable navigating radio options with Tab
                                    // e.preventDefault();
                                    // const next = nodes[(i + e.shiftKey ? -1 : 1) % nodes.length];
                                    // next.control.toggleAttribute("checked", true);
                                    // next.focus();
                                    break;
                                case "Enter":
                                    // Submit the form
                                    // e.preventDefault();
                                    // el.control.toggleAttribute("checked", true);
                                    // reasonForm.requestSubmit();
                                    break;
                                default:
                                    break;
                            }
                        })
                });

            // reasonForm.addEventListener("keydown", e => {
            //     if (e.key === 'Enter') reasonForm.requestSubmit();
            // })

            /**
             * @description Handle submission of 'entry' by collecting data from visitor form and reason form.
             */
            reasonForm.addEventListener("submit", async e => {
                console.log(e)
                e.preventDefault();
                reasonDialog.close();

                /** 
                 * @type {HTMLDialogElement} Popup for showing status messages
                 */
                const popup = window.createPopupMessage();
                popup.showModal();

                const record = new VisitorRecord();

                // 1. Collate data from all forms
                const forms = [reasonForm, entryForm];
                forms.forEach(form => {
                    const formdata = new FormData(form);
                    for (const [key, val] of formdata.entries()) {
                        record[key] = val;
                    }
                });

                const body = JSON.stringify(record);

                try {
                    const method = "POST";
                    const headers = { "Content-type": "application/json" };
                    const options = { body, method, headers };

                    // 2. Log the entry
                    const entryResult = await fetch('/api/entry', options)
                        .then(async res => {
                            if (res.ok) {
                                const sfx = await new Audio(config["audioSuccess"]);
                                sfx.play();
                                popup.showMessage("SUCCESS", i18n.getTranslation(currentLang(), "entry-welcome"));

                            }
                            return res.json();
                        })
                        .finally(() => console.log(`Entry POST finished`))

                    // 3. Attempt to print label
                    const label = new Label(720, 427, '/assets/logo.svg');
                    const bytes = await label.draw({ name: `${record['firstName']} ${record['lastName']}`, reason: record['reason'] })
                        .then(blob => blob.bytes());

                    const labeldata = JSON.stringify({
                        "label": bytes.toBase64()
                    });

                    const printResult = await fetch('/api/print', { method: 'POST', body: labeldata, headers: { 'Content-Type': 'application/json' } })
                        .then(res => res.json())
                        .then(({ status, data, error }) => {
                            if (error) throw new Error(error);
                            return { status, data };
                        })
                        .finally(() => console.log(`Print POST finished`))

                    // 3.a If print succeeded, update record
                    if (printResult.status === "OK") {
                        toasts.newToast("SUCCESS", "Label successfully printed. Have a good day!");
                        await fetch(`/api/entry/${entryResult.data.lastInsertRowid}`, { body: JSON.stringify({ labelPrinted: 1 }), method: "PATCH", headers, })
                            .then(res => res.json())
                            .then(({ status, data, error }) => {
                                if (error) throw new Error(error);
                                return data;
                            })
                            .finally(() => console.log(`Entry update POST finished`))

                        // 3.a.1 Optimistically update the current label count
                        const labelCount = parseInt(labelCurrentCountIndicator.value) - 1;
                        labelCurrentCountIndicator.dispatchEvent(new LabelCountEvent(labelCount));

                        // 3.a.2 Save new label count to database
                        const currentLabelCount = await fetch(`/api/config/labelCurrentCount`, {
                            method: "PATCH",
                            body: JSON.stringify({ value: labelCount }),
                            headers: {
                                "Content-type": "application/json"
                            }
                        })
                            .then(res => res.json())
                            .then(({ status, data, error }) => {
                                if (error) throw new Error(error);
                            });
                    } else {
                        // 3.b If print fails, throw the stderr message
                        throw printResult.data;
                    }
                    console.log(entryResult, printResult);
                    // popup.showMessage("Success", i18n.getTranslation(currentLang(), "entry-welcome"));
                    // loaderDialog.dispatchEvent(new LoadingEvent("Success", i18n.getTranslation(currentLang(), "entry-welcome")));

                } catch (err) {
                    console.error(err);
                    toasts.newToast("ERROR", `An error occurred: ${err.message}`);
                    // popup.showMessage("ERROR", err.message);
                } finally {
                    setTimeout(() => {
                        popup.close();
                    }, 5000);

                    // Return focus to entryForm once popup is closed
                    popup.addEventListener("close", () => {
                        firstNameInput.focus({ focusVisible: true });
                    })

                    entryForm.reset();
                    reasonForm.reset();
                    reasonForm.querySelectorAll('input[type="radio"]').forEach(el => el.toggleAttribute("checked", false));
                }
            })

            /*
            *
            * ADMIN LOGIN FORM
            *
            */

            configLoginForm.addEventListener("submit", e => {
                e.preventDefault();

                const valid = configLoginForm.reportValidity()
                if (!valid) return;

                const password = configLoginForm.password.value;
                // loaderDialog.dispatchEvent(new LoadingEvent("LOADING", "loading"));
                fetch('/api/auth', {
                    method: 'POST',
                    body: JSON.stringify({ password }),
                    headers: { "Content-type": "application/json" }
                })
                    .then(res => {
                        if (!res.ok) throw new Error("Incorrect password");
                        return res.json()
                    })
                    .then(data => {
                        // loaderDialog.close();
                        window.location = '/configuration.html';
                    })
                    .catch(err => {
                        // loaderDialog.dispatchEvent(new LoadingEvent("ERROR", err.message))
                    })
            });

            // Cycle background every 10 minutes
            const backdrops = ["/backdrops/backdrop1.webp", "/backdrops/backdrop2.webp", "/backdrops/backdrop3.webp", "/backdrops/backdrop4.webp"]
            const backdropCycle = new Backdrops(document.body, ...backdrops);
            setInterval(() => {
                backdropCycle.swapBackdrops();
            }, 10 * 60 * 1000); // Change every 10 minutes

        })
    </script>
</body>
