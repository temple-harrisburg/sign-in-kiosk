<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles.css" />
    <script src="/js/i18n.js"></script>
    <script src="/js/barcode.js"></script>
    <script src="/js/popupMessage.js"></script>
    <script src="/js/backdrop.js"></script>
    <title>Sign-in Kiosk</title>
</head>

<body>
    <header>
        <h1>Sign-in Kiosk</h1>
        <div class="header-options">
            <form id="i18n">
                <fieldset>
                    <legend data-i18n="i18n-title">Language</legend>
                    <label for="lang-en">EN</label>
                    <input type="radio" name="lang" value="EN" id="lang-en" checked />
                    <label for="lang-es">ES</label>
                    <input type="radio" name="lang" value="ES" id="lang-es" />
                </fieldset>
            </form>
            <button command="show-modal" commandfor="config-login-modal" class="button base"
                data-i18n="config-login-button">Edit
                Configuration</button>
            <button id="barcode-scan-launch" class="button base" data-i18n="barcode-button">Scan Barcode</button>
        </div>
        <dialog id="config-login-modal" closedby="any" class="popup drop-shadow">
            <form id="config-login-form" method="dialog">
                <label for="password" data-i18n="password">Password</label>
                <input type="password" name="password" id="password" required />
                <button type="submit" class="button accent" data-i18n="submit">Submit</button>
            </form>
        </dialog>
    </header>
    <main id="main">
        <dialog id="reason-modal" class="popup drop-shadow">
            <form id="reason-form" method="dialog">
                <fieldset class="reason-field">
                    <legend data-i18n="reason-greeting">What brings you to Temple Harrisburg?</legend>
                    <input type="radio" name="reason" id="conference" value="Conference" class="visually-hidden"
                        checked />
                    <label for="conference" class="reason-opt button accent" tabindex="0"
                        data-i18n="reason-conference">Conference</label>

                    <input type="radio" name="reason" id="training" value="Training" class="visually-hidden" />
                    <label for="training" class="reason-opt button accent" tabindex="0"
                        data-i18n="reason-training">Training</label>

                    <input type="radio" name="reason" id="meeting" value="Meeting" class="visually-hidden" />
                    <label for="meeting" class="reason-opt button accent" tabindex="0"
                        data-i18n="reason-meeting">Meeting</label>

                    <input type="radio" name="reason" id="event" value="Event" class="visually-hidden" />
                    <label for="event" class="reason-opt button accent" tabindex="0"
                        data-i18n="reason-event">Event</label>
                </fieldset>
                <button value="default" type="submit" class="button accent" data-i18n="submit">Submit</button>
                <button value="cancel" type="button" command="close" commandfor="reason-modal" class="button base"
                    data-i18n="cancel">Cancel</button>
            </form>
        </dialog>
        <dialog id="barcode-result-modal" closedby="any" class="popup drop-shadow">
            <form method="dialog" id="barcode-result-form">
                <div class="field-wrapper">
                    <label for="firstName" data-i18n="first-name">First Name</label>
                    <input type="text" name="firstName" id="barcodeFirstName" disabled>
                </div>
                <div class="field-wrapper">
                    <label for="lastName" data-i18n="last-name">Last Name</label>
                    <input type="text" name="lastName" id="barcodeLastName" disabled>
                </div>
                <p data-i18n="barcode-confirm-correct">Is this correct?</p>
                <div id="barcode-result-buttons-group">
                    <button type="submit" id="barcode-result-confirm" data-i18n="yes">Yes</button>
                    <button type="button" id="barcode-result-edit" data-i18n="edit">Edit</button>
                    <button id="barcode-result-save" data-i18n="save" class="visually-hidden" disabled>Save</button>
                    <button type="button" id="barcode-result-cancel" data-i18n="cancel"
                        commandfor="barcode-result-modal" command="close">Cancel</button>
                </div>
            </form>
        </dialog>
        <form id="entry-form" method="dialog" class="drop-shadow">
            <input type="hidden" name="method" id="method" value="form">
            <input type="hidden" name="labelPrinted" id="labelPrinted" value="0">
            <div class="field-wrapper">
                <label for="firstName" class="visually-hidden" data-i18n="first-name">First Name</label>
                <input type="text" id="firstName" name="firstName" placeholder="First Name" required
                    class="field large" />
            </div>
            <div class="field-wrapper">
                <label for="lastName" class="visually-hidden" data-i18n="last-name">Last Name</label>
                <input type="text" id="lastName" name="lastName" placeholder="Last Name" required class="field large" />
            </div>
            <button type="submit" command="show-modal" commandfor="reason-modal" class="button accent"><span
                    data-i18n="continue">Continue</span>...</button>
        </form>
    </main>
    <footer>
        <p>Copyright Temple University 2026</p>
        <p title="Current label count" id="label-count-wrapper">
            <label for="label-current-count"><span class="visually-hidden">Labels Remaining</span><svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 640 640"><!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
                    <path
                        d="M433.2 103.1L581.4 253.4C609.1 281.5 609.1 326.5 581.4 354.6L425 512.9C415.7 522.3 400.5 522.4 391.1 513.1C381.7 503.8 381.6 488.6 390.9 479.2L547.3 320.8C556.5 311.5 556.5 296.4 547.3 287.1L399 136.9C389.7 127.5 389.8 112.3 399.2 103C408.6 93.7 423.8 93.8 433.1 103.2zM64.1 293.5L64.1 160C64.1 124.7 92.8 96 128.1 96L261.6 96C278.6 96 294.9 102.7 306.9 114.7L450.9 258.7C475.9 283.7 475.9 324.2 450.9 349.2L317.4 482.7C292.4 507.7 251.9 507.7 226.9 482.7L82.9 338.7C70.9 326.7 64.2 310.4 64.2 293.4zM208.1 208C208.1 190.3 193.8 176 176.1 176C158.4 176 144.1 190.3 144.1 208C144.1 225.7 158.4 240 176.1 240C193.8 240 208.1 225.7 208.1 208z" />
                </svg></label>
            <input type="number" value="300" name="label-current-count" id="label-current-count" disabled inert />
        </p>
    </footer>
    <script>

        /**
         * Custom event for the barcode scan process
         */
        class BarcodeScanEvent extends Event {
            /**
             * @typedef {"ERROR"|"OK"} BarcodeScanStatus
             * @typedef {{firstName:string, lastName:string}} BarcodeScanData
             * @typedef {{status:BarcodeScanStatus, data:BarcodeScanData}} BarcodeScanResult
             * @type {BarcodeScanResult}
             */
            #result = { status: "ERROR", data: { firstName: undefined, lastName: undefined } };

            /**
             * @param {BarcodeScanStatus} status
             * @param {BarcodeScanData} data
             */
            constructor(status, data) {
                super("barcode-scan");
                this.#result = { status, data };
            }

            get status() {
                return this.#result.status;
            }

            get data() {
                return this.#result.data;
            }
        }

        /**
         * Custom event for pre-filling the entry form with data from the barcode scanner
         */
        class AutofillFormEvent extends Event {
            /**
             * @param {Record<string,string>} data
             */
            constructor(data) {
                super("autofill");
                this.data = data;
            }
        }

        /**
         * Custom event for optimistically updating the current label count.
         */
        class LabelCountEvent extends Event {
            /**
             * @param {number} count;
             */
            constructor(count) {
                super("label-count");
                this.count = count;
            }
        }

        class VisitorRecord {
            /**
             * Date and time of visitor's entry.
             * @type {Date}
             */
            entryDateTime

            /**
             * First name of the visitor
             * @type {string}
             */
            firstName

            /**
             * Last name of the visitor
             * @type {string}
             */
            lastName

            /**
             * Reason for visit
             * @type {string}
             */
            reason

            /**
             * Method used to complete the entry
             * @type {"form"|"barcode"}
             */
            method

            /**
             * Whether or not the label printed successfully (0 for no, 1 for yes).
             * @type {number}
             */
            labelPrinted

            constructor() {
                this.entryDateTime = new Date();
            }
        }

        class Config {
            /**
             * The password to modify configuration from the config panel
             * @type {string}
             */
            password

            /**
             * Default number of labels
             * @type {number}
             */
            labelDefaultCount

            /**
             * Current count of labels
             * @type {number}
             */
            labelCurrentCount

            /**
             * Sound effect for successful entry. Must be path relative to `/sfx`
             * @type {string}
             */
            audioEntryComplete

            /**
             * Sound effect for low labels. Must be path relative to `/sfx`
             * @type {string}
             */
            audioLowLabels
        }

        window.addEventListener("DOMContentLoaded", async () => {

            // Entry form elements
            /**
             * @type {HTMLFormElement}
             */
            const entryForm = document.getElementById("entry-form");

            /**
             * @type {HTMLFormElement}
             */
            const reasonForm = document.getElementById("reason-form");

            /**
             * @type {HTMLDialogElement}
             */
            const reasonDialog = document.getElementById("reason-modal");

            // Barcode Elements
            /**
            * @type {HTMLButtonElement}
            */
            const barcodeLaunchButton = document.getElementById("barcode-scan-launch");

            /**
             * @type {HTMLFormElement}
             */
            const barcodeForm = document.getElementById("barcode-scan-form");

            /**
             * @type {HTMLDialogElement}
             */
            const barcodeResultDialog = document.getElementById("barcode-result-modal");
            const barcodeResultForm = document.getElementById("barcode-result-form");
            const barcodeResultEditButton = document.getElementById("barcode-result-edit");
            const barcodeResultConfirmButton = document.getElementById("barcode-result-confirm");
            const barcodeResultSaveButton = document.getElementById("barcode-result-save");

            /**
             * @type {HTMLDivElement}
             */
            const barcodeResultButtonsGroup = document.getElementById("barcode-result-buttons-group");

            /**
             * @type {HTMLInputElement}
             */
            const labelCurrentCountIndicator = document.getElementById("label-current-count");

            /**
             * Internationalization form
             * @type {HTMLFormElement}
             */
            const internationalizationForm = document.getElementById("i18n");

            /**
             * Admin configuration login form
             * @type {HTMLFormElement}
             */
            const configLoginForm = document.getElementById("config-login-form");


            /**
             * @typedef {Record<string, string>} Config
             * @returns {Config}
             */
            async function initConfig() {
                return fetch('/api/config')
                    .then(data => data.json())
                    .then(({ status, data, error }) => {
                        if (error) throw error;
                        return Object.fromEntries(data.map(({ key, value }) => [key, value]))
                    })
                    .catch(err => {
                        // loaderDialog.dispatchEvent(new LoadingEvent("ERROR", `Something went wrong: ${err}`));
                    });
            }

            /**
             * @type {Config}
             */
            const config = await initConfig()
                .then(config => {
                    labelCurrentCountIndicator.value = config["labelCurrentCount"];
                })

            labelCurrentCountIndicator.addEventListener("label-count", async ({ count }) => {
                labelCurrentCountIndicator.value = count;
                if (count <= config["labelLowThreshold"]) {
                    const sfx = await new Audio(config["audioLowTone"]);
                    await sfx.play();
                }
            })

            /**
             * @returns {"EN"|"ES"} Code representing current language
             */
            function currentLang() {
                return internationalizationForm.lang.value;
            }

            /**
             * 
             * INTERNATIONALIZATION FORM
             * 
             */
            internationalizationForm.addEventListener("change", () => {
                const { value: langCode } = internationalizationForm.lang;
                console.log(`Switching to language: ${langCode}`);
                i18n.translate(langCode, document.body);
            });


            /**
            * 
            * BARCODE SCANNING
            * see '/barcode.js'
            * @typedef {Object} BarcodeHandler
            * @typedef {Object} Pdf417Parser
            */

            /**
             * @type {HTMLDialogElement|undefined}
             */
            let barcodePopup;
            const parseInputCallback = (keyboardEvents) => {
                console.log(`Caught ${keyboardEvents.length} keystrokes`)
                try {
                    /**
                     * @type {Pdf417Parser}
                     */
                    const parser = new Pdf417Parser();
                    parser.feed(...keyboardEvents);
                    const result = Object.fromEntries(parser.result);

                    const [firstName, lastName] = [result["DAC"], result["DCS"]]
                    // loaderDialog.close();
                    barcodeResultDialog.dispatchEvent(new BarcodeScanEvent("OK", { firstName, lastName }));
                } catch (err) {
                    console.error(err);
                    barcodePopup.showMessage("ERROR", err.message);
                }
            }

            const startReadingCallback = () => {
                barcodePopup.showSpinner();
                barcodePopup.showModal();
            };

            const handler = new BarcodeHandler({ timeoutDuration: 20, parseInputCallback, startReadingCallback });
            function handleKeydown(e) {
                handler.handleKeydown(e);
            }

            barcodeLaunchButton.addEventListener("click", e => {
                barcodePopup = window.createPopupMessage();
                barcodePopup.showMessage("Waiting for input from scanner...");
                barcodePopup.showModal();
                console.log("Starting keydown trap")
                document.addEventListener("keydown", handleKeydown);

                barcodePopup.addEventListener("close", () => {
                    console.log("Ending keydown trap");
                    document.removeEventListener("keydown", handleKeydown);
                });
            });


            barcodeResultDialog.addEventListener("barcode-scan", e => {
                const { status, data } = e;
                if (status === "OK") {
                    barcodeResultDialog.querySelector("input#barcodeFirstName").value = data.firstName;
                    barcodeResultDialog.querySelector("input#barcodeLastName").value = data.lastName;
                }
                barcodeResultDialog.showModal();
                barcodePopup.close();
            });

            barcodeResultForm.addEventListener("submit", e => {
                const inputs = Array.from(barcodeResultForm.querySelectorAll("input"));
                const entries = inputs.map(input => [input.name, input.value]);
                entries.push(['method', 'barcode']);
                const autoFillEvent = new AutofillFormEvent(Object.fromEntries(entries));
                entryForm.dispatchEvent(autoFillEvent);
            })

            barcodeResultEditButton.addEventListener("click", () => {
                // Show 'Save' button
                barcodeResultSaveButton.classList.toggle('visually-hidden', false);
                barcodeResultSaveButton.toggleAttribute("disabled", false)

                // Hide 'Edit' button
                barcodeResultEditButton.classList.toggle('visually-hidden', true);
                barcodeResultEditButton.toggleAttribute("disabled", true)

                // Hide 'Yes' button
                barcodeResultConfirmButton.classList.toggle('visually-hidden', true);
                barcodeResultConfirmButton.toggleAttribute("disabled", true);

                // Unlock inputs
                const firstNameInput = barcodeResultDialog.querySelector("input#barcodeFirstName")
                firstNameInput.toggleAttribute("disabled", false)
                firstNameInput.focus();

                barcodeResultDialog.querySelector("input#barcodeLastName").toggleAttribute("disabled", false)
            })

            barcodeResultSaveButton.addEventListener("click", () => {
                // Hide 'Save' button
                barcodeResultSaveButton.classList.toggle('visually-hidden', true);
                barcodeResultSaveButton.toggleAttribute("disabled", true);

                // Show 'Edit' button
                barcodeResultEditButton.classList.toggle('visually-hidden', false);
                barcodeResultEditButton.toggleAttribute("disabled", false)

                // Show 'Yes' button
                barcodeResultConfirmButton.classList.toggle('visually-hidden', false);
                barcodeResultConfirmButton.toggleAttribute("disabled", false)

                // Lock inputs
                barcodeResultDialog.querySelector("input#barcodeFirstName").toggleAttribute("disabled", true)
                barcodeResultDialog.querySelector("input#barcodeLastName").toggleAttribute("disabled", true)
            });


            /**
             * 
             * ENTRY FORMS 
             * 
             */

            entryForm.addEventListener("autofill", ({ data }) => {
                for (const [key, value] of Object.entries(data)) {
                    entryForm[key].value = value;
                }
            })


            const entryContinueButton = entryForm.querySelector("button")
            entryContinueButton.addEventListener("click", () => { if (entryForm.reportValidity()) reasonDialog.showModal() })

            reasonForm.querySelectorAll('label.reason-opt').forEach(
                /**
                 * @param {HTMLLabelElement} el
                 */
                (el, i, parent) => {
                    el.addEventListener("keydown",
                        /**
                         * @param {KeyboardEvent} e
                         */
                        e => {
                            const { key } = e;
                            console.log(key)
                            switch (key) {
                                case "Tab":
                                    break;
                                case "Enter":
                                    const active = el.control.getAttribute("checked") === '' ?? false;
                                    if (active) {
                                        el.control.toggleAttribute("checked", false);
                                    } else {
                                        el.control.toggleAttribute("checked", true);
                                        reasonForm.querySelector('button[type="submit"]').focus();
                                    }

                                    break;
                                /**
                                 * @todo add handlers for keyboard events
                                 */
                                case "ArrowLeft":
                                    break;
                                case "ArrowRight":
                                    break;
                                default:
                                    break;
                            }
                        })

                })

            /**
             * @description Handle submission of 'entry' by collecting data from visitor form and reason form.
             */
            reasonForm.addEventListener("submit", async e => {
                e.preventDefault();
                reasonDialog.close();

                /** 
                 * @type {HTMLDialogElement} Popup for showing status messages
                 */
                const popup = window.createPopupMessage();
                popup.showModal();

                const record = new VisitorRecord();

                // 1. Collate data from all forms
                const forms = [reasonForm, entryForm];
                forms.forEach(form => {
                    const formdata = new FormData(form);
                    for (const [key, val] of formdata.entries()) {
                        record[key] = val;
                    }
                });

                const body = JSON.stringify(record);

                try {
                    const method = "POST";
                    const headers = { "Content-type": "application/json" };
                    const options = { body, method, headers };

                    // 2. Log the entry
                    const entryResult = await fetch('/api/entry', options)
                        .then(res => {
                            if (res.ok) {
                                popup.showMessage("SUCCESS", i18n.getTranslation(currentLang(), "entry-welcome"));
                            }
                            return res.json();
                        })
                        .finally(() => console.log(`Entry POST finished`))

                    // 3. Attempt to print label
                    const printResult = await fetch('/api/print', options)
                        .then(res => res.json())
                        .then(({ status, data, error }) => {
                            if (error) throw new Error(error);
                            return { status, data };
                        })
                        .finally(() => console.log(`Print POST finished`))

                    // 3.a If print succeeded, update record
                    if (printResult.status === "OK") {
                        await fetch(`/api/entry/${entryResult.data.lastInsertRowid}`, { body: JSON.stringify({ labelPrinted: 1 }), method: "PATCH", headers, })
                            .then(res => res.json())
                            .then(({ status, data, error }) => {
                                if (error) throw new Error(error);
                                return data;
                            })
                            .finally(() => console.log(`Entry update POST finished`))

                        // 3.a.1 Optimistically update the current label count
                        const labelCount = parseInt(labelCurrentCountIndicator.value) - 1;
                        labelCurrentCountIndicator.dispatchEvent(new LabelCountEvent(labelCount));

                        // 3.a.2 Save new label count to database
                        const currentLabelCount = await fetch(`/api/config/labelCurrentCount`, {
                            method: "PATCH",
                            body: JSON.stringify({ value: labelCount }),
                            headers: {
                                "Content-type": "application/json"
                            }
                        })
                            .then(res => res.json())
                            .then(({ status, data, error }) => {
                                if (error) throw new Error(error);
                            });
                    } else {
                        // 3.b If print fails, throw the stderr message
                        throw printResult.data;
                    }
                    console.log(entryResult, printResult);
                    popup.showMessage("Success", i18n.getTranslation(currentLang(), "entry-welcome"));
                    // loaderDialog.dispatchEvent(new LoadingEvent("Success", i18n.getTranslation(currentLang(), "entry-welcome")));

                } catch (err) {
                    console.error(err);
                    popup.showMessage("ERROR", err.message);
                } finally {
                    entryForm.reset();
                    reasonForm.reset();
                }


            })

            /*
            *
            * ADMIN LOGIN FORM
            *
            */

            configLoginForm.addEventListener("submit", e => {
                e.preventDefault();

                const valid = configLoginForm.reportValidity()
                if (!valid) return;

                const password = configLoginForm.password.value;
                // loaderDialog.dispatchEvent(new LoadingEvent("LOADING", "loading"));
                fetch('/api/auth', {
                    method: 'POST',
                    body: JSON.stringify({ password }),
                    headers: { "Content-type": "application/json" }
                })
                    .then(res => {
                        if (!res.ok) throw new Error("Incorrect password");
                        return res.json()
                    })
                    .then(data => {
                        // loaderDialog.close();
                        window.location = '/configuration.html';
                    })
                    .catch(err => {
                        // loaderDialog.dispatchEvent(new LoadingEvent("ERROR", err.message))
                    })
            })

        })
    </script>
</body>

</html>
